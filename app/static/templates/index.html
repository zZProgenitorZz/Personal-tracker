{% import "_macros.html" as ui %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07060c">
<title>Progen</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/trackly.css">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
<script src="/static/trackly.js" defer></script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#dashboard">
      <span class="brand-mark"><img src="/static/icon.svg" alt="" width="34" height="34"></span>
      Progen
    </a>

    <nav class="nav-links" aria-label="Main">
      <a href="#dashboard" data-page="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#library" data-page="library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
        <span>Library</span>
      </a>
      <a href="#progress" data-page="progress">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        <span>Progress</span>
      </a>
      <a href="#settings" data-page="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <button class="btn btn-primary btn-sm nav-add" type="button" data-open-add>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span>Add series</span>
    </button>
  </div>
</header>

<main id="page" class="container" aria-live="polite">
  <div class="loading" aria-label="Loading"></div>
</main>

<div id="toasts" class="toasts"></div>

<dialog id="add-dialog" class="dialog" aria-labelledby="add-title">
  <form class="dialog-form" hx-post="/ui/series" hx-target="#toasts" hx-swap="beforeend" hx-encoding="multipart/form-data" hx-disinherit="*">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">New</p>
        <h2 id="add-title">Add a series</h2>
      </div>
      <button class="btn-close" type="button" data-close aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <label class="field">
      <span>Title</span>
      <input class="input" id="series-title" name="title" required autocomplete="off" placeholder="Solo Leveling">
    </label>

    <div class="field">
      <span>Cover <small>optional</small></span>
      <div class="cover-picker" id="cover-picker">
        <div class="cover-frame" id="cover-preview" aria-label="Cover preview"></div>
        <div class="cover-controls">
          <div class="cover-buttons">
            <button class="btn btn-ghost btn-sm" id="find-cover" type="button"
                    hx-get="/ui/covers/search" hx-include="#series-title, #cover-index"
                    hx-target="#cover-preview" hx-indicator="#cover-picker"
                    hx-on:htmx:before-request="coverSkips = 0">
              <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="spinner" aria-hidden="true"></span>
              Find cover
            </button>
            <label class="btn btn-ghost btn-sm">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
              Upload
              <input type="file" id="cover-file" name="cover_file" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" class="sr-only">
            </label>
            <button class="btn-link" type="button" id="cover-clear" hidden>Remove</button>
          </div>
          <input class="input input-sm" id="cover-link" name="cover_link" type="url" inputmode="url" autocomplete="off" placeholder="…or paste an image URL">
          <div id="cover-caption" class="cover-caption" aria-live="polite">Search for a cover by title, upload an image, or paste a link.</div>
        </div>
      </div>
    </div>

    <div class="field">
      <span>Type</span>
      <div class="segmented" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="kind" value="manhwa" checked><span>Manhwa</span></label>
        <label><input type="radio" name="kind" value="novel"><span>Novel</span></label>
      </div>
    </div>

    <div class="field">
      <span>Status</span>
      <div class="segmented segmented-4" role="radiogroup" aria-label="Status">
        <label><input type="radio" name="status" value="reading" checked><span><i class="dot dot-reading"></i>Reading</span></label>
        <label><input type="radio" name="status" value="completed"><span><i class="dot dot-completed"></i>Completed</span></label>
        <label><input type="radio" name="status" value="on_hold"><span><i class="dot dot-on_hold"></i>On hold</span></label>
        <label><input type="radio" name="status" value="dropped"><span><i class="dot dot-dropped"></i>Dropped</span></label>
      </div>
    </div>

    <div class="field">
      <span>Genres <small id="genre-hint">optional · found covers fill these in</small></span>
      {{ ui.genre_picker() }}
    </div>

    <div class="field-row">
      <label class="field">
        <span>Where you read it</span>
        <input class="input" name="source" autocomplete="off" placeholder="asuracomic.net">
      </label>
      <label class="field">
        <span>Current chapter</span>
        <input class="input" name="start_chapter" type="number" step="any" min="0" value="0">
      </label>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary">Add series</button>
    </div>
  </form>
</dialog>

<dialog id="genre-dialog" class="dialog" aria-label="Edit genres">
  <div id="genre-editor"></div>
</dialog>

<dialog id="confirm-dialog" class="dialog dialog-confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="dialog-form">
    <span class="danger-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    </span>
    <div class="confirm-text">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" value="cancel" autofocus>Cancel</button>
      <button class="btn btn-danger" id="confirm-action" value="confirm"></button>
    </div>
  </form>
</dialog>
</body>
</html>
