{# The login form; a wrong password renders it again with the error. Posts through htmx (CSRF check). #}
<form id="login-form" class="login-form" hx-post="/login" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field">
    <span>Password</span>
    <input class="input" type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn btn-primary" type="submit">Sign in</button>
</form>
