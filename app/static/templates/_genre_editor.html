{% import "_macros.html" as ui %}
{# Inhoud van het venster "Edit genres" (#genre-editor in index.html). #}
<form class="dialog-form" hx-post="/ui/series/{{ entry.series_id }}/genres" hx-target="#toasts" hx-swap="beforeend">
  <div class="dialog-head">
    <div>
      <p class="eyebrow">Genres</p>
      <h2>{{ entry.title }}</h2>
    </div>
    <button class="btn-close" type="button" data-close-dialog aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  {{ ui.genre_picker(entry.genres) }}
  <div class="dialog-actions">
    <button class="btn btn-ghost" type="button" data-close-dialog>Cancel</button>
    <button class="btn btn-primary">Save genres</button>
  </div>
</form>
