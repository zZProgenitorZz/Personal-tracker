{% import "_macros.html" as ui %}
{# Contents of the "Edit genres" window (#genre-editor in index.html), for every tracker. #}
<form class="dialog-form" hx-post="{{ action }}" hx-target="#toasts" hx-swap="beforeend">
  <div class="dialog-head">
    <div>
      <p class="eyebrow">Genres</p>
      <h2>{{ title }}</h2>
    </div>
    <button class="btn-close" type="button" data-close-dialog aria-label="Close">{{ ui.icon('x', 18) }}</button>
  </div>
  {{ ui.genre_picker(options, selected) }}
  <div class="dialog-actions">
    <button class="btn btn-ghost" type="button" data-close-dialog>Cancel</button>
    <button class="btn btn-primary">Save genres</button>
  </div>
</form>
