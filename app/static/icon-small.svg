<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Progen">
  <!-- Vereenvoudigde versie van icon.svg voor kleine maten (taakbalk, systeemvak, 16-48 px):
       dezelfde kleuren en hetzelfde idee (ring + open boek), zonder fijne details die op
       een paar pixels samenvallen. scripts/make_icon.py gebruikt hem voor de kleine maten. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3b1d66"/><stop offset="1" stop-color="#140a26"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d6af0"/><stop offset="1" stop-color="#5a24b0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/><stop offset="0.5" stop-color="#e2b453"/><stop offset="1" stop-color="#b07a24"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9c8f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- de ring (de slang), dik genoeg om op 20 px nog een ring te zijn -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="64"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <!-- de kop van de slang: een gouden accent bovenaan rechts -->
  <circle cx="375" cy="137" r="30" fill="url(#gold)"/>
  <!-- het open boek, groot in het midden -->
  <path fill="url(#gold)" d="M136,318 C180,304 222,309 256,330 C290,309 332,304 376,318 L376,334 C332,320 290,326 256,348 C222,326 180,320 136,334 Z"/>
  <path fill="url(#page)" d="M248,208 C214,190 174,188 140,198 L140,312 C176,302 214,306 248,324 Z"/>
  <path fill="url(#page)" d="M264,208 C298,190 338,188 372,198 L372,312 C336,302 298,306 264,324 Z"/>
</svg>
